<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Yakındaki Tüm Camiler</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    button { padding: 10px 15px; font-size: 16px; cursor: pointer; }
    #status { margin-top: 10px; font-weight: bold; }
    ul { margin-top: 15px; list-style-type: square; }
  </style>
</head>
<body>

  <h2>Yakındaki Tüm Camiler</h2>
  <button onclick="camileriBul()">Tüm Camileri Bul</button>
  
  <div id="status"></div>
  <ul id="cami-listesi"></ul>

  <script>
    async function camileriBul() {
      const status = document.getElementById('status');
      const liste = document.getElementById('cami-listesi');
      
      liste.innerHTML = '';
      status.innerText = 'Konumunuz alınıyor...';

      // 1. Tarayıcı Konum İzni Kontrolü
      if (!navigator.geolocation) {
        status.innerText = 'Tarayıcınız konum bilgisini desteklemiyor.';
        return;
      }

      navigator.geolocation.getCurrentPosition(async (position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        
        status.innerText = 'Yakındaki camiler aranıyor...';

        // 2. Overpass API Sorgusu
        const radius = 5000;

        const query = `
          [out:json][timeout:30];
          (
            node["amenity"="place_of_worship"]["religion"="muslim"](around:${radius},${lat},${lon});
            way["amenity"="place_of_worship"]["religion"="muslim"](around:${radius},${lat},${lon});
            relation["amenity"="place_of_worship"]["religion"="muslim"](around:${radius},${lat},${lon});
          );
          out center tags;
        `;

        try {
          // Birinci Overpass sunucusu
          let response = await fetch(
            'https://overpass-api.de/api/interpreter',
            {
              method: 'POST',
              headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
              },
              body: 'data=' + encodeURIComponent(query)
            }
          );

          // İlk sunucu çalışmazsa ikinci sunucuyu dene
          if (!response.ok) {
            response = await fetch(
              'https://overpass.kumi.systems/api/interpreter',
              {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: 'data=' + encodeURIComponent(query)
              }
            );
          }

          if (!response.ok) {
            throw new Error('Overpass API cevap vermedi.');
          }

          const data = await response.json();

          if (!data.elements || data.elements.length === 0) {
            status.innerText = 'Yakınınızda cami bulunamadı.';
            return;
          }

          status.innerText =
            `Toplam ${data.elements.length} cami bulundu:`;

          // 3. Bulunan Camileri Listeleme
          data.elements.forEach(item => {

            const name =
              item.tags && item.tags.name
                ? item.tags.name
                : 'İsimsiz Cami';

            const li = document.createElement('li');

            li.textContent = name;

            liste.appendChild(li);
          });

        } catch (error) {
          console.error('Hata:', error);

          status.innerText =
            'Veri çekilirken bir hata oluştu. Lütfen tekrar deneyin.';
        }

      }, (error) => {

        // Konum izin hataları
        switch(error.code) {

          case error.PERMISSION_DENIED:
            status.innerText =
              "Konum izni reddedildi. Lütfen tarayıcı ayarlarından izin verin.";
            break;

          case error.POSITION_UNAVAILABLE:
            status.innerText =
              "Konum bilgisi alınamıyor.";
            break;

          case error.TIMEOUT:
            status.innerText =
              "Konum isteği zaman aşımına uğradı.";
            break;

          default:
            status.innerText =
              "Bilinmeyen bir konum hatası oluştu.";
            break;
        }
      });

    }
  </script>

</body>
</html>
