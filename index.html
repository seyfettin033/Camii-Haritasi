<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Türkiye Camii Rehberi</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
    header { background: #092c22; color: #fff; padding: 10px; text-align: center; }
    .tabs { display: flex; background: #15513f; }
    .tab-btn { flex: 1; padding: 10px; color: #fff; border: none; background: transparent; cursor: pointer; }
    .tab-btn.active { background: #d4af37; color: #000; font-weight: bold; }
    .filters { padding: 10px; background: #f4f7f5; }
    .filter-group { display: none; }
    .filter-group.active { display: block; }
    select, input, button { width: 100%; padding: 10px; margin-top: 5px; font-size: 14px; }
    #sayac { padding: 8px 10px; background: #e2ede7; font-weight: bold; font-size: 13px; }
    #map { flex: 1; width: 100%; }
  </style>
</head>
<body>

<header>
  <h2 style="margin:0;">🕌 Türkiye Camii Rehberi</h2>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('konum')">📍 Yakınımdakiler</button>
  <button class="tab-btn" onclick="switchTab('isimsiz')">⚠️ İsimsiz Camiler</button>
  <button class="tab-btn" onclick="switchTab('tum')">🕌 Tüm Camiler</button>
</div>

<div class="filters">
  <div id="group-konum" class="filter-group active">
    <button onclick="konumlaCamileriBul()">📍 Bulunduğum Konumdaki Camileri Göster</button>
  </div>

  <div id="group-isimsiz" class="filter-group">
    <select id="il-isimsiz" onchange="isimsizCamileriGetir(this.value)">
      <option value="">Lütfen İl Seçiniz</option>
    </select>
  </div>

  <div id="group-tum" class="filter-group">
    <select id="il-tum" onchange="tumCamileriGetir(this.value)">
      <option value="">Lütfen İl Seçiniz</option>
    </select>
  </div>
</div>

<div id="sayac">Lütfen bir işlem seçin.</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const iller = [
    "Adana", "Adıyaman", "Afyonkarahisar", "Ağrı", "Amasya", "Ankara", "Antalya", "Artvin", "Aydın", "Balıkesir",
    "Bilecik", "Bingöl", "Bitlis", "Bolu", "Burdur", "Bursa", "Çanakkale", "Çankırı", "Çorum", "Denizli",
    "Diyarbakır", "Edirne", "Elazığ", "Erzincan", "Erzurum", "Eskişehir", "Gaziantep", "Giresun", "Gümüşhane", "Hakkari",
    "Hatay", "Isparta", "Mersin", "İstanbul", "İzmir", "Kars", "Kastamonu", "Kayseri", "Kırklareli", "Kırşehir",
    "Kocaeli", "Konya", "Kütahya", "Malatya", "Manisa", "Kahramanmaraş", "Mardin", "Muğla", "Muş", "Nevşehir",
    "Niğde", "Ordu", "Rize", "Sakarya", "Samsun", "Siirt", "Sinop", "Sivas", "Tekirdağ", "Tokat",
    "Trabzon", "Tunceli", "Şanlıurfa", "Uşak", "Van", "Yozgat", "Zonguldak", "Aksaray", "Bayburt", "Karaman",
    "Kırıkkale", "Batman", "Şırnak", "Bartın", "Ardahan", "Iğdır", "Yalova", "Karabük", "Kilis", "Osmaniye", "Düzce"
  ];

  const sel1 = document.getElementById("il-isimsiz");
  const sel2 = document.getElementById("il-tum");
  iller.forEach(il => {
    sel1.add(new Option(il, il));
    sel2.add(new Option(il, il));
  });

  const map = L.map('map').setView([39, 35], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  const layerGroup = L.layerGroup().addTo(map);

  function switchTab(mode) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.filter-group').forEach(g => g.classList.remove('active'));
    layerGroup.clearLayers();
    document.getElementById('sayac').innerText = "Lütfen bir il seçin veya konumunuzu açın.";

    if (mode === 'konum') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('group-konum').classList.add('active');
    } else if (mode === 'isimsiz') {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('group-isimsiz').classList.add('active');
    } else {
      document.querySelectorAll('.tab-btn')[2].classList.add('active');
      document.getElementById('group-tum').classList.add('active');
    }
  } 

  function konumlaCamileriBul() {
    if (!navigator.geolocation) return alert("Konum desteklenmiyor.");
    document.getElementById('sayac').innerText = "📡 Konum tespiti yapılıyor...";
    navigator.geolocation.getCurrentPosition(pos => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      map.setView([lat, lon], 14);
      L.marker([lat, lon]).addTo(layerGroup).bindPopup("Buradasınız").openPopup();
      const q = `[out:json][timeout:25];(node["amenity"="place_of_worship"]["religion"="muslim"](around:5000,${lat},${lon});way
