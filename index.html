<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Türkiye Camii Rehberi & Veri Katkı Haritası</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
* { box-sizing: border-box; }
html, body { height:100%; margin:0; padding:0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background:#f4f5f7;
  color:#1f2937;
  display: flex;
  flex-direction: column;
}
header {
  background:#fff;
  padding:12px;
  border-bottom:1px solid #e5e7eb;
  text-align:center;
}
header h1 {
  margin:0;
  font-size:18px;
  color:#14532d;
}
header small { color:#6b7280; }

.etiket {
  background:#ecfdf5;
  color:#065f46;
  text-align:center;
  font-size:12px;
  padding:6px;
  border-bottom:1px solid #d1fae5;
}

/* Sekmeler */
.tabs {
  display: flex;
  background: #e5e7eb;
  border-bottom: 1px solid #d1d5db;
  overflow-x: auto;
}
.tab-btn {
  flex: 1;
  min-width: 110px;
  padding: 10px 6px;
  border: none;
  background: transparent;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  color: #4b5563;
  white-space: nowrap;
}
.tab-btn.active {
  background: #fff;
  color: #14532d;
  border-bottom: 2px solid #14532d;
}

.filters {
  padding:10px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
}
.filter-group {
  display: none;
}
.filter-group.active {
  display: block;
}

select, input {
  width:100%;
  padding:8px;
  border-radius:6px;
  border:1px solid #d1d5db;
  font-size:14px;
}
.search-box {
  display: flex;
  gap: 6px;
}
.search-box input { flex: 1; }
.btn-action {
  padding: 8px 14px;
  background: #14532d;
  color: white;
  border: none;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
}
.btn-action:hover {
  background: #15803d;
}
.btn-location {
  width: 100%;
  padding: 10px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 6px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-location:hover {
  background: #1d4ed8;
}

#sayac {
  background:#fff;
  padding:10px;
  text-align:center;
  font-size:14px;
  font-weight:600;
  color:#14532d;
  border-bottom:1px solid #e5e7eb;
}

#map { flex: 1; width: 100%; min-height: 350px; }

/* Popup Stilleri */
.popup { font-size:13px; text-align: center; }
.popup b { color:#14532d; display: block; margin-bottom: 2px; }
.popup small { color: #6b7280; display: block; margin-bottom: 6px; }

.popup-links {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  margin-top: 6px;
}

.popup a {
  display:block;
  text-align:center;
  padding:7px 4px;
  border-radius:6px;
  text-decoration:none;
  font-weight:600;
  font-size:11px;
  transition: opacity 0.2s;
}
.popup a:hover { opacity: 0.85; }

/* Buton Renkleri */
.osm { background:#166534; color:#fff; grid-column: span 2; }
.google { background:#fde047; color:#000; }
.diyanet { background:#1e3a8a; color:#fff; }
.mapillary { background:#059669; color:#fff; }
.panoramax { background:#7c3aed; color:#fff; }
.osm-note { background:#dc2626; color:#fff; grid-column: span 2; }
</style>
</head>

<body>

<header>
  <h1>🕌 Türkiye Camii Rehberi</h1>
  <small>OpenStreetMap Veri İyileştirme & Görselleştirme Platformu</small>
</header>

<div class="etiket">
ℹ️ Camileri inceleyebilir, Mapillary/Panoramax ile fotoğrafları görebilir veya OSM'ye not bırakabilirsiniz.
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('konum')">📍 Yakınımdakiler</button>
  <button class="tab-btn" onclick="switchTab('isimsiz')">⚠️ İsimsiz Camiler</button>
  <button class="tab-btn" onclick="switchTab('tum')">🕌 Tüm Camiler</button>
  <button class="tab-btn" onclick="switchTab('arama')">🔍 Cami Ara</button>
</div>

<div class="filters">
  <!-- 0. Mod: Konumuma Yakın Camiler -->
  <div id="group-konum" class="filter-group active">
    <button class="btn-location" onclick="konumlaCamileriBul()">
      📍 Bulunduğum Konuma Göre Yakındaki Camileri Göster
    </button>
  </div>

  <!-- 1. Mod: İsimsiz Camileri Bul -->
  <div id="group-isimsiz" class="filter-group">
    <select id="il-isimsiz" onchange="isimsizCamileriGetir(this.value)">
      <option value="">İl seçiniz (İsimsiz camiler için)</option>
    </select>
  </div>

  <!-- 2. Mod: Tüm Camileri Listele -->
  <div id="group-tum" class="filter-group">
    <select id="il-tum" onchange="tumCamileriGetir(this.value)">
      <option value="">İl seçiniz (Tüm camiler için)</option>
    </select>
  </div>

  <!-- 3. Mod: İsimle Cami Ara -->
  <div id="group-arama" class="filter-group">
    <div class="search-box">
      <input type="text" id="cami-ismi" placeholder="Cami adı girin (Örn: Süleymaniye, Ulu Cami)">
      <button class="btn-action" onclick="camiAra()">Ara</button>
    </div>
  </div>
</div>

<div id="sayac">Bulunduğunuz yerdeki camileri aramak için butona tıklayın.</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

// Select menülerini plaka sırasına göre doldurma
const ilSelectIsimsiz = document.getElementById("il-isimsiz");
const ilSelectTum = document.getElementById("il-tum");

iller.forEach(il => {
  const metin = `${il.plaka} - ${il.isim}`;

  const o1 = document.createElement("option");
  o1.value = il.isim;
  o1.textContent = metin;
  ilSelectIsimsiz.appendChild(o1);

  const o2 = document.createElement("option");
  o2.value = il.isim;
  o2.textContent = metin;
  ilSelectTum.appendChild(o2);
});

// Harita Başlatma
const map = L.map('map').setView([39, 35], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© OpenStreetMap katkıda bulunanlar'
}).addTo(map);

const layer = L.layerGroup().addTo(map);

// Sekme Değiştirme
function switchTab(mode) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('.filter-group').forEach(grp => grp.classList.remove('active'));

  layer.clearLayers();
  const sayac = document.getElementById("sayac");

  if (mode === 'konum') {
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    document.getElementById('group-konum').classList.add('active');
    sayac.innerHTML = "Bulunduğunuz yerdeki camileri aramak için 'Bulunduğum Konuma Göre Yakındaki Camileri Göster' butonuna tıklayın.";
  } else if (mode === 'isimsiz') {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('group-isimsiz').classList.add('active');
    sayac.innerHTML = "İsimsiz camileri listelemek için bir il seçin.";
  } else if (mode === 'tum') {
    document.querySelectorAll('.tab-btn')[2].classList.add('active');
    document.getElementById('group-tum').classList.add('active');
    sayac.innerHTML = "Seçtiğiniz ildeki tüm camileri haritada görmek için bir il seçin.";
  } else {
    document.querySelectorAll('.tab-btn')[3].classList.add('active');
    document.getElementById('group-arama').classList.add('active');
    sayac.innerHTML = "Aramak istediğiniz cami adını yazıp 'Ara' butonuna basın.";
  }
}

// 0. KONUMA GÖRE YAKINDAKİ CAMİLERİ BUL
function konumlaCamileriBul() {
  const sayac = document.getElementById("sayac");

  if (!navigator.geolocation) {
    alert("Tarayıcınız konum özelliğini desteklemiyor.");
    return;
  }

  sayac.innerHTML = "📡 Konumunuz alınıyor, lütfen izin verin...";

  navigator.geolocation.getCurrentPosition(
    (position) => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      // Kullanıcının kendi konumunu gösteren Mavi İşaretçi
      layer.clearLayers();
      const userMarker = L.marker([lat, lon]).addTo(layer)
        .bindPopup("<b>📍 Sizin Konumunuz</b>").openPopup();

      map.setView([lat, lon], 14);

      // Konumun etrafındaki 3000 metrelik (3 km) yarıçaptaki camileri getir
      const query = `
      [out:json][timeout:30];
      (
        node["amenity"="place_of_worship"]["religion"="muslim"](around:3000, ${lat}, ${lon});
        way["amenity"="place_of_worship"]["religion"="muslim"](around:3000, ${lat}, ${lon});
      );
      out center;
      `;

      overpassSorgula(query, "Mevcut konumunuza yakındaki camiler (3 km yarıçap)", "#2563eb", false);
    },
    (error) => {
      let mesaj = "Konum alınamadı.";
      if (error.code === error.PERMISSION_DENIED) {
        mesaj = "Konum erişim izni reddedildi. Lütfen tarayıcı ayarlarınızdan izin verin.";
      }
      sayac.innerHTML = `❌ ${mesaj}`;
      alert(mesaj);
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

// 1. İSİMSİZ CAMİLERİ GETİR
function isimsizCamileriGetir(il) {
  if (!il) return;

  let areaFilter = `area["name"="${il}"]["admin_level"="4"]->.a;`;
  let areaTarget = `(area.a)`;

  if (il === "Tüm Türkiye") {
    areaFilter = `area["name"="Türkiye"]["admin_level"="2"]->.tr;`;
    areaTarget = `(area.tr)`;
  }

  const query = `
  [out:json][timeout:30];
  ${areaFilter}
  (
    node["amenity"="place_of_worship"]["religion"="muslim"]["name"!~"."]${areaTarget};
    way["amenity"="place_of_worship"]["religion"="muslim"]["name"!~"."]${areaTarget};
  );
  out center 500;
  `;

  overpassSorgula(query, `<b>${il}</b> genelindeki isimsiz camiler`, "#ef4444");
}

// 2. TÜM CAMİLERİ GETİR
function tumCamileriGetir(il) {
  if (!il) return;

  let areaFilter = `area["name"="${il}"]["admin_level"="4"]->.a;`;
  let areaTarget = `(area.a)`;

  if (il === "Tüm Türkiye") {
    areaFilter = `area["name"="Türkiye"]["admin_level"="2"]->.tr;`;
    areaTarget = `(area.tr)`;
  }

  const query = `
  [out:json][timeout:30];
  ${areaFilter}
  (
    node["amenity"="place_of_worship"]["religion"="muslim"]${areaTarget};
    way["amenity"="place_of_worship"]["religion"="muslim"]${areaTarget};
  );
  out center 500;
  `;

  overpassSorgula(query, `<b>${il}</b> genelindeki tüm camiler`, "#14532d");
}

// 3. İSİMLE CAMİ ARA
function camiAra() {
  const isim = document.getElementById("cami-ismi").value.trim();
  if (!isim) {
    alert("Lütfen bir cami adı girin.");
    return;
  }

  const query = `
  [out:json][timeout:30];
  area["name"="Türkiye"]["admin_level"="2"]->.tr;
  (
    node["amenity"="place_of_worship"]["religion"="muslim"]["name"~"${isim}",i](area.tr);
    way["amenity"="place_of_worship"]["religion"="muslim"]["name"~"${isim}",i](area.tr);
  );
  out center 100;
  `;

  overpassSorgula(query, `<b>"${isim}"</b> araması sonuçları`, "#2563eb");
}

// Ortak Overpass İstek ve Popup Oluşturma Fonksiyonu
function overpassSorgula(query, baslikMetni, noktaRengi, temizle = true) {
  if (temizle) layer.clearLayers();
  
  const sayac = document.getElementById("sayac");
  sayac.innerHTML = `⏳ Veriler çekiliyor...`;

  fetch("https://overpass-api.de/api/interpreter", {
    method: "POST",
    body: query
  })
  .then(r => {
    if (!r.ok) throw new Error("Ağ hatası oluştu.");
    return r.json();
  })
  .then(data => {
    const adet = data.elements.length;

    if (adet === 0) {
      sayac.innerHTML = `❌ ${baslikMetni} için kayıt bulunamadı.`;
      return;
    }

    sayac.innerHTML = `📍 ${baslikMetni} – <b>${adet}</b> sonuç bulundu.`;

    const bounds = [];
    data.elements.forEach(el => {
      const lat = el.lat || el.center.lat;
      const lon = el.lon || el.center.lon;
      const id = el.id;
      const type = el.type;
      const camiAdi = el.tags && el.tags.name ? el.tags.name : "❗ İsimsiz Cami";

      bounds.push([lat, lon]);

      const popup = `
      <div class="popup">
        <b>${camiAdi}</b>
        <small>ID: ${type}/${id}</small>

        <div class="popup-links">
          <!-- Haritalar -->
          <a class="google" target="_blank" rel="noopener"
             href="https://www.google.com/maps?q=${lat},${lon}">
             🔍 Google
          </a>

          <a class="diyanet" target="_blank" rel="noopener"
             href="https://camiler.diyanet.gov.tr">
             🕌 Diyanet
          </a>

          <!-- Fotoğraf Platformları -->
          <a class="mapillary" target="_blank" rel="noopener"
             href="https://www.mapillary.com/app/?lat=${lat}&lng=${lon}&z=18">
             📸 Mapillary
          </a>

          <a class="panoramax" target="_blank" rel="noopener"
             href="https://panoramax.openstreetmap.fr/#focus=map&map=18/${lat}/${lon}">
             📷 Panoramax
          </a>

          <!-- OSM Katkı Araçları -->
          <a class="osm" target="_blank" rel="noopener"
             href="https://www.openstreetmap.org/edit?${type}=${id}#map=19/${lat}/${lon}">
             ✍️ OSM'de Düzenle
          </a>

          <a class="osm-note" target="_blank" rel="noopener"
             href="https://www.openstreetmap.org/note/new#map=19/${lat}/${lon}">
             🚨 Hata Bildir / Not Ekle
          </a>
        </div>
      </div>`;

      L.circleMarker([lat, lon], {
        radius: 6,
        color: "#ffffff",
        weight: 1.5,
        fillColor: noktaRengi,
        fillOpacity: 0.9
      }).addTo(layer).bindPopup(popup);
    });

    if (bounds.length > 0 && temizle) {
      map.fitBounds(bounds, { padding: [30, 30] });
    }
  })
  .catch(err => {
    sayac.innerHTML = `❌ Veri yüklenirken sorun oluştu. Lütfen tekrar deneyin.`;
    console.error(err);
  });
}

// Enter tuşu desteği
document.getElementById("cami-ismi").addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    camiAra();
  }
});
</script>

</html>
