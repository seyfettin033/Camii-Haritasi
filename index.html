<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Türkiye Camii Rehberi & Veri Katkı Haritası</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<!-- Leaflet Marker Cluster CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

<style>
* { box-sizing: border-box; }
html, body { height:100%; margin:0; padding:0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #0f2d24;
  color: #e2f0d9;
  display: flex;
  flex-direction: column;
}

header {
  background: linear-gradient(135deg, #071f18 0%, #0d382d 50%, #061913 100%);
  color: #f7e3ad;
  padding: 16px 12px;
  text-align: center;
  border-bottom: 2px solid #d4af37;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
}
header h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: #fce8b3;
}
.bayrak-img {
  width: 28px;
  height: auto;
  border-radius: 3px;
  border: 1px solid #d4af37;
}
header small { 
  color: #d4af37; 
  font-size: 12px;
  margin-top: 4px;
  display: block;
}

.ayet-box {
  background: linear-gradient(90deg, #09261f 0%, #114235 50%, #09261f 100%);
  color: #f1e4c3;
  text-align: center;
  padding: 10px 14px;
  border-bottom: 1px solid #c5a028;
  font-size: 13px;
}
.ayet-box strong { color: #f5cf68; display: block; font-size: 11px; margin-bottom: 2px; }

.tabs {
  display: flex;
  background: #09211a;
  border-bottom: 2px solid #b89321;
}
.tab-btn {
  flex: 1;
  padding: 12px 6px;
  border: none;
  background: transparent;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  color: #a3c2b5;
  transition: all 0.2s;
}
.tab-btn.active {
  background: #124537;
  color: #fce8b3;
  border-bottom: 3px solid #fce8b3;
}

.filters {
  padding: 12px;
  background: #0d3328;
  border-bottom: 1px solid #1c5e4c;
}
.filter-group { display: none; }
.filter-group.active { display: block; }

select, input {
  width: 100%;
  padding: 11px;
  border-radius: 8px;
  border: 1.5px solid #d4af37;
  background: #061c15;
  color: #fce8b3;
  font-size: 14px;
  outline: none;
}

.search-box-group { display: flex; flex-direction: column; gap: 8px; }
.search-box { display: flex; gap: 8px; }
.search-box input { flex: 1; }

.btn-action, .btn-location {
  padding: 12px;
  background: linear-gradient(135deg, #c5a028 0%, #9e7d17 100%);
  color: #061c15;
  border: 1px solid #fce8b3;
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
  width: 100%;
}

#sayac-container {
  background: #08211a;
  padding: 10px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #1c5e4c;
}

#sayac { font-size: 13px; font-weight: 600; color: #f1e4c3; }

.btn-excel {
  background: #1f7a4a;
  color: #fff;
  border: 1px solid #2ecc71;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  display: none;
}

#map { flex: 1; width: 100%; min-height: 400px; }

.popup { font-size: 12px; text-align: center; color: #222; }
.popup b { color: #0d382d; font-size: 14px; display: block; margin-bottom: 4px; }
.popup-links { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 6px; }
.popup a {
  display: block; padding: 6px 2px; border-radius: 4px;
  text-decoration: none; font-weight: 600; font-size: 11px; color: #fff;
}
.osm { background: #0d382d; grid-column: span 2; border: 1px solid #d4af37; }
.google { background: #d9a74a; }
</style>
</head>

<body>

<header>
  <h1>
    <img src="https://flagcdn.com/w40/tr.png" alt="Türkiye" class="bayrak-img">
    Türkiye Camii Rehberi
  </h1>
  <small>❖ OpenStreetMap Veri Görselleştirme Platformu ❖</small>
</header>

<div class="ayet-box">
  <strong>📖 GÜNÜN AYET-İ KERİMESİ</strong>
  <span id="ayet-metin">"Allah'ın mescitlerini ancak Allah'a ve ahiret gününe inananlar imar eder..."</span>
  <span id="ayet-sure">(Tevbe Suresi, 18. Ayet)</span>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('konum')">📍 Yakınımdakiler</button>
  <button class="tab-btn" onclick="switchTab('isimsiz')">⚠️ İsimsiz Camiler</button>
  <button class="tab-btn" onclick="switchTab('tum')">🕌 Tüm Camiler</button>
  <button class="tab-btn" onclick="switchTab('arama')">🔍 Cami Ara</button>
</div>

<div class="filters">

  <div id="group-konum" class="filter-group active">
    <button class="btn-location" onclick="konumlaCamileriBul()">
      📍 Bulunduğum Konuma Göre Camileri Göster (5 km)
    </button>
  </div>

  <div id="group-isimsiz" class="filter-group">
    <select id="il-isimsiz" onchange="isimsizCamileriGetir(this.value)">
      <option value="">Lütfen İl Seçiniz (Plaka Kodu - İl Adı)</option>
    </select>
  </div>

  <div id="group-tum" class="filter-group">
    <select id="il-tum" onchange="tumCamileriGetir(this.value)">
      <option value="">Lütfen İl Seçiniz (Plaka Kodu - İl Adı)</option>
    </select>
  </div>

  <div id="group-arama" class="filter-group">
    <div class="search-box-group">
      <select id="il-arama">
        <option value="">Tüm Türkiye Geneli</option>
      </select>
      <div class="search-box">
        <input type="text" id="cami-ismi" placeholder="Cami adı girin (Örn: Süleymaniye)" onkeyup="if(event.key==='Enter') camiAra()">
        <button class="btn-action" style="width:auto;" onclick="camiAra()">Ara</button>
      </div>
    </div>
  </div>

</div>

<div id="sayac-container">
  <div id="sayac">Arama yapmak için seçim yapın.</div>
  <button id="btn-excel" class="btn-excel" onclick="excelIndir()">📊 Excel İndir</button>
</div>

<div id="map"></div>

<!-- Leaflet & JS Altyapıları -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
let mevcutCamiVerileri = [];

const iller = [
  { plaka: "01", ad: "Adana" }, { plaka: "02", ad: "Adıyaman" }, { plaka: "03", ad: "Afyonkarahisar" },
  { plaka: "04", ad: "Ağrı" }, { plaka: "05", ad: "Amasya" }, { plaka: "06", ad: "Ankara" },
  { plaka: "07", ad: "Antalya" }, { plaka: "08", ad: "Artvin" }, { plaka: "09", ad: "Aydın" },
  { plaka: "10", ad: "Balıkesir" }, { plaka: "11", ad: "Bilecik" }, { plaka: "12", ad: "Bingöl" },
  { plaka: "13", ad: "Bitlis" }, { plaka: "14", ad: "Bolu" }, { plaka: "15", ad: "Burdur" },
  { plaka: "16", ad: "Bursa" }, { plaka: "17", ad: "Çanakkale" }, { plaka: "18", ad: "Çankırı" },
  { plaka: "19", ad: "Çorum" }, { plaka: "20", ad: "Denizli" }, { plaka: "21", ad: "Diyarbakır" },
  { plaka: "22", ad: "Edirne" }, { plaka: "23", ad: "Elazığ" }, { plaka: "24", ad: "Erzincan" },
  { plaka: "25", ad: "Erzurum" }, { plaka: "26", ad: "Eskişehir" }, { plaka: "27", ad: "Gaziantep" },
  { plaka: "28", ad: "Giresun" }, { plaka: "29", ad: "Gümüşhane" }, { plaka: "30", ad: "Hakkari" },
  { plaka: "31", ad: "Hatay" }, { plaka: "32", ad: "Isparta" }, { plaka: "33", ad: "Mersin" },
  { plaka: "34", ad: "İstanbul" }, { plaka: "35", ad: "İzmir" }, { plaka: "36", ad: "Kars" },
  { plaka: "37", ad: "Kastamonu" }, { plaka: "38", ad: "Kayseri" }, { plaka: "39", ad: "Kırklareli" },
  { plaka: "40", ad: "Kırşehir" }, { plaka: "41", ad: "Kocaeli" }, { plaka: "42", ad: "Konya" },
  { plaka: "43", ad: "Kütahya" }, { plaka: "44", ad: "Malatya" }, { plaka: "45", ad: "Manisa" },
  { plaka: "46", ad: "Kahramanmaraş" }, { plaka: "47", ad: "Mardin" }, { plaka: "48", ad: "Muğla" },
  { plaka: "49", ad: "Muş" }, { plaka: "50", ad: "Nevşehir" }, { plaka: "51", ad: "Niğde" },
  { plaka: "52", ad: "Ordu" }, { plaka: "53", ad: "Rize" }, { plaka: "54", ad: "Sakarya" },
  { plaka: "55", ad: "Samsun" }, { plaka: "56", ad: "Siirt" }, { plaka: "57", ad: "Sinop" },
  { plaka: "58", ad: "Sivas" }, { plaka: "59", ad: "Tekirdağ" }, { plaka: "60", ad: "Tokat" },
  { plaka: "61", ad: "Trabzon" }, { plaka: "62", ad: "Tunceli" }, { plaka: "63", ad: "Şanlıurfa" },
  { plaka: "64", ad: "Uşak" }, { plaka: "65", ad: "Van" }, { plaka: "66", ad: "Yozgat" },
  { plaka: "67", ad: "Zonguldak" }, { plaka: "68", ad: "Aksaray" }, { plaka: "69", ad: "Bayburt" },
  { plaka: "70", ad: "Karaman" }, { plaka: "71", ad: "Kırıkkale" }, { plaka: "72", ad: "Batman" },
  { plaka: "73", ad: "Şırnak" }, { plaka: "74", ad: "Bartın" }, { plaka: "75", ad: "Ardahan" },
  { plaka: "76", ad: "Iğdır" }, { plaka: "77", ad: "Yalova" }, { plaka: "78", ad: "Karabük" },
  { plaka: "79", ad: "Kilis" }, { plaka: "80", ad: "Osmaniye" }, { plaka: "81", ad: "Düzce" }
];

// Sayfa yüklendiğinde açılır listeleri kesin dolduran fonksiyon
document.addEventListener("DOMContentLoaded", function() {
  const ilSelectIsimsiz = document.getElementById("il-isimsiz");
  const ilSelectTum = document.getElementById("il-tum");
  const ilSelectArama = document.getElementById("il-arama");

  iller.forEach((il) => {
    const etiket = `${il.plaka} - ${il.ad}`;
    if (ilSelectIsimsiz) ilSelectIsimsiz.add(new Option(etiket, il.plaka));
    if (ilSelectTum) ilSelectTum.add(new Option(etiket, il.plaka));
    if (ilSelectArama) ilSelectArama.add(new Option(etiket, il.plaka));
  });
});

const map = L.map('map').setView([39.0, 35.0], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© OpenStreetMap'
}).addTo(map);

const clusterGroup = L.markerClusterGroup({ maxClusterRadius: 40 }).addTo(map);

function switchTab(mode) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('.filter-group').forEach(grp => grp.classList.remove('active'));
  clusterGroup.clearLayers();
  mevcutCamiVerileri = [];
  document.getElementById("btn-excel").style.display = "none";

  if (mode === 'konum') {
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    document.getElementById('group-konum').classList.add('active');
  } else if (mode === 'isimsiz') {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('group-isimsiz').classList.add('active');
  } else if (mode === 'tum') {
    document.querySelectorAll('.tab-btn')[2].classList.add('active');
    document.getElementById('group-tum').classList.add('active');
  } else {
    document.querySelectorAll('.tab-btn')[3].classList.add('active');
    document.getElementById('group-arama').classList.add('active');
  }
}

/* 📍 YAKINDAKİ CAMİLER */
function konumlaCamileriBul() {
  const sayac = document.getElementById("sayac");

  if (!navigator.geolocation) {
    alert("Cihazınız konum servisini desteklemiyor.");
    return;
  }

  sayac.innerHTML = "📡 Konumunuz alınıyor...";

  navigator.geolocation.getCurrentPosition(
    (position) => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      clusterGroup.clearLayers();

      const userMarker = L.marker([lat, lon]).bindPopup("<b>📍 Buradasınız</b>");
      clusterGroup.addLayer(userMarker);
      userMarker.openPopup();

      map.setView([lat, lon], 14);

      const query = `[out:json][timeout:30];
      (
        node["amenity"="place_of_worship"]["religion"="muslim"](around:5000,${lat},${lon});
        way["amenity"="place_of_worship"]["religion"="muslim"](around:5000,${lat},${lon});
        node["building"="mosque"](around:5000,${lat},${lon});
        way["building"="mosque"](around:5000,${lat},${lon});
      );
      out center;`;

      overpassSorgula(query, "Yakınınızdaki camiler (5 km)", "#d4af37", false);
    },
    (err) => {
      console.error(err);
      sayac.innerHTML = "❌ Konum alınamadı. Tarayıcınızda konum izninin açık olduğundan emin olun.";
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

/* ⚠️ İSİMSİZ CAMİLER */
function isimsizCamileriGetir(plakaNo) {
  if (!plakaNo) return;

  const ilObj = iller.find(i => i.plaka === plakaNo);
  const ilAdi = ilObj ? ilObj.ad : plakaNo;

  const query = `[out:json][timeout:90];
  area["ISO3166-2"="TR-${plakaNo}"]["admin_level"="4"]->.il;
  (
    node["amenity"="place_of_worship"]["religion"="muslim"](!name)(area.il);
    way["amenity"="place_of_worship"]["religion"="muslim"](!name)(area.il);
    node["building"="mosque"](!name)(area.il);
    way["building"="mosque"](!name)(area.il);
  );
  out center;`;

  overpassSorgula(query, `${plakaNo} - ${ilAdi} ilindeki isimsiz camiler`, "#e74c3c");
}

/* 🕌 TÜM CAMİLER */
function tumCamileriGetir(plakaNo) {
  if (!plakaNo) return;

  const ilObj = iller.find(i => i.plaka === plakaNo);
  const ilAdi = ilObj ? ilObj.ad : plakaNo;

  const query = `[out:json][timeout:90];
  area["ISO3166-2"="TR-${plakaNo}"]["admin_level"="4"]->.il;
  (
    node["amenity"="place_of_worship"]["religion"="muslim"](area.il);
    way["amenity"="place_of_worship"]["religion"="muslim"](area.il);
    node["building"="mosque"](area.il);
    way["building"="mosque"](area.il);
  );
  out center;`;

  overpassSorgula(query, `${plakaNo} - ${ilAdi} ilindeki tüm camiler`, "#d4af37");
}

/* 🔍 CAMİ ARAMA */
function camiAra() {
  const isim = document.getElementById("cami-ismi").value.trim();
  const plakaNo = document.getElementById("il-arama").value;

  if (!isim) return alert("Lütfen aramak istediğiniz cami ismini yazın.");

  let query = "";
  if (plakaNo) {
    query = `[out:json][timeout:60];
    area["ISO3166-2"="TR-${plakaNo}"]["admin_level"="4"]->.il;
    (
      node["amenity"="place_of_worship"]["religion"="muslim"]["name"~"${isim}",i](area.il);
      way["amenity"="place_of_worship"]["religion"="muslim"]["name"~"${isim}",i](area.il);
      node["building"="mosque"]["name"~"${isim}",i](area.il);
      way["building"="mosque"]["name"~"${isim}",i](area.il);
    );
    out center;`;
  } else {
    query = `[out:json][timeout:60];
    area["ISO3166-1"="TR"]["admin_level"="2"]->.tr;
    (
      node["amenity"="place_of_worship"]["religion"="muslim"]["name"~"${isim}",i](area.tr);
      way["amenity"="place_of_worship"]["religion"="muslim"]["name"~"${isim}",i](area.tr);
      node["building"="mosque"]["name"~"${isim}",i](area.tr);
      way["building"="mosque"]["name"~"${isim}",i](area.tr);
    );
    out center;`;
  }

  overpassSorgula(query, `"${isim}" Arama Sonuçları`, "#d4af37");
}

/* 🚀 OVERPASS SORGULAMA */
function overpassSorgula(query, baslikMetni, noktaRengi, temizle = true) {
  if (temizle) {
    clusterGroup.clearLayers();
    mevcutCamiVerileri = [];
  }

  const sayac = document.getElementById("sayac");
  const btnExcel = document.getElementById("btn-excel");

  btnExcel.style.display = "none";
  sayac.innerHTML = `⏳ ${baslikMetni} yükleniyor...`;

  fetch("https://overpass-api.de/api/interpreter", {
    method: "POST",
    body: "data=" + encodeURIComponent(query)
  })
  .then(r => r.json())
  .then(data => {
    if (!data.elements || data.elements.length === 0) {
      sayac.innerHTML = `❌ ${baslikMetni} için sonuç bulunamadı.`;
      return;
    }

    const bounds = [];
    const markers = [];

    data.elements.forEach(el => {
      const lat = el.lat || (el.center && el.center.lat);
      const lon = el.lon || (el.center && el.center.lon);

      if (!lat || !lon) return;

      const rawName = (el.tags && el.tags.name) ? el.tags.name : "İsimsiz Cami";

      mevcutCamiVerileri.push({
        "OSM_ID": `${el.type}/${el.id}`,
        "Cami Adı": rawName,
        "Enlem": lat,
        "Boylam": lon
      });

      bounds.push([lat, lon]);

      const popup = `
      <div class="popup">
        <b>${rawName}</b>
        <div class="popup-links">
          <a class="google" target="_blank" href="https://www.google.com/maps?q=${lat},${lon}">Google Maps</a>
          <a class="osm" target="_blank" href="https://www.openstreetmap.org/edit?${el.type}=${el.id}">OSM Düzenle</a>
        </div>
      </div>`;

      const m = L.circleMarker([lat, lon], {
        radius: 6,
        color: "#ffffff",
        weight: 1,
        fillColor: noktaRengi,
        fillOpacity: 0.9
      }).bindPopup(popup);

      markers.push(m);
    });

    clusterGroup.addLayers(markers);

    if (bounds.length > 0 && temizle) {
      map.fitBounds(bounds, { padding: [20, 20] });
    }

    sayac.innerHTML = `📍 ${baslikMetni} – <b>${data.elements.length}</b> cami bulundu.`;
    btnExcel.style.display = "inline-block";
  })
  .catch(err => {
    console.error(err);
    sayac.innerHTML = `❌ Veriler alınırken hata oluştu. Sunucu yoğun olabilir, tekrar deneyin.`;
  });
}

function excelIndir() {
  if (mevcutCamiVerileri.length === 0) return;
  const worksheet = XLSX.utils.json_to_sheet(mevcutCamiVerileri);
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, "Camiler");
  XLSX.writeFile(workbook, `camiler_${new Date().toISOString().slice(0, 10)}.xlsx`);
}
</script>
</body>
</html>
