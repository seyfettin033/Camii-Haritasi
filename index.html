<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelişmiş Cami & Mescid Bulucu</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- FontAwesome İkonları -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
        }

        /* Sol Kontrol & Liste Paneli */
        #sidebar {
            width: 380px;
            background: #1e293b;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 25px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            border-right: 1px solid #334155;
        }

        .header {
            padding: 24px 20px;
            background: linear-gradient(135deg, #0d9488, #0f766e);
            color: white;
        }

        .header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header p {
            font-size: 0.82rem;
            opacity: 0.85;
            margin-top: 6px;
        }

        .controls {
            padding: 18px 20px;
            border-bottom: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #0d9488;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #14b8a6;
            transform: translateY(-1px);
        }

        .btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
            transform: none;
        }

        /* İstatistik & Durum */
        .status-bar {
            padding: 10px 20px;
            font-size: 0.85rem;
            color: #94a3b8;
            background: #0f172a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Sonuç Listesi */
        #results-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .place-card {
            background: #334155;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .place-card:hover {
            border-color: #0d9488;
            background: #3e4c5e;
        }

        .place-card h3 {
            font-size: 0.95rem;
            color: #f1f5f9;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .place-card .tag {
            font-size: 0.7rem;
            background: #0d9488;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 500;
        }

        .place-card .tag.unnamed {
            background: #64748b;
        }

        .place-card p {
            font-size: 0.8rem;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Harita Alanı */
        #map {
            flex: 1;
            height: 100%;
        }

        /* Yükleniyor Göstergesi */
        .loader {
            display: none;
            text-align: center;
            padding: 20px;
            color: #14b8a6;
        }

        .loader i {
            font-size: 1.8rem;
            animation: spin 1s infinite linear;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mobil Uyum */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            #sidebar {
                width: 100%;
                height: 40%;
            }
            #map {
                height: 60%;
            }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">
            <h1><i class="fa-solid => fa-mosque"></i> Cami Bulucu</h1>
            <p>Etrafınızdaki veya harita alanındaki tüm cami ve mescidleri hızlıca bulun.</p>
        </div>

        <div class="controls">
            <button id="search-btn" class="btn">
                <i class="fa-solid fa-crosshairs"></i> Konumumun Çevresinde Ara
            </button>
            <button id="search-bbox-btn" class="btn" style="background-color: #3b82f6;">
                <i class="fa-solid fa-map-marked-alt"></i> Harita Alanında Ara
            </button>
        </div>

        <div class="status-bar">
            <span id="status-text">Arama yapmak için bir butona basın.</span>
            <span id="count-badge"></span>
        </div>

        <div id="loader" class="loader">
            <i class="fa-solid fa-spinner"></i>
            <p style="margin-top: 8px; font-size: 0.85rem;">Yakındaki ibadethaneler taranıyor...</p>
        </div>

        <div id="results-list"></div>
    </div>

    <div id="map"></div>

    <script>
        // Harita Başlatma (Varsayılan: İstanbul)
        const map = L.map('map').setView([41.0082, 28.9784], 13);

        // Koyu Tema Harita Katmanı (CartoDB Dark Matter)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            maxZoom: 19
        }).addTo(map);

        let markersGroup = L.layerGroup().addTo(map);

        // İkon Yapılandırması
        const mosqueIcon = L.divIcon({
            html: `<div style="background:#0d9488; color:white; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid white; box-shadow:0 2px 6px rgba(0,0,0,0.3);"><i class="fa-solid fa-mosque" style="font-size:14px;"></i></div>`,
            className: '',
            iconSize: [30, 30],
            iconAnchor: [15, 15]
        });

        const userIcon = L.divIcon({
            html: `<div style="background:#ef4444; color:white; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid white; box-shadow:0 2px 6px rgba(0,0,0,0.4);"><i class="fa-solid fa-user" style="font-size:10px;"></i></div>`,
            className: '',
            iconSize: [24, 24],
            iconAnchor: [12, 12]
        });

        // Konuma göre Arama
        document.getElementById('search-btn').addEventListener('click', () => {
            if (navigator.geolocation) {
                showLoader(true);
                updateStatus("Konumunuz alınıyor...");
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lon = pos.coords.longitude;
                        
                        map.setView([lat, lon], 15);
                        
                        // Kullanıcı İkonu
                        L.marker([lat, lon], { icon: userIcon }).addTo(markersGroup)
                            .bindPopup("<b>Buradasınız</b>").openPopup();

                        // 3 KM Yarıçapında Arama Yap
                        const query = `
                            [out:json][timeout:25];
                            (
                              node["amenity"="place_of_worship"]["religion"="muslim"](around:3000, ${lat}, ${lon});
                              way["amenity"="place_of_worship"]["religion"="muslim"](around:3000, ${lat}, ${lon});
                              relation["amenity"="place_of_worship"]["religion"="muslim"](around:3000, ${lat}, ${lon});
                            );
                            out center;
                        `;
                        fetchOverpassData(query);
                    },
                    (err) => {
                        showLoader(false);
                        alert("Konum alınamadı! Lütfen konum izinlerinizi kontrol edin.");
                    }
                );
            } else {
                alert("Tarayıcınız konum servisini desteklemiyor.");
            }
        });

        // Haritada Görünen Alanda Arama
        document.getElementById('search-bbox-btn').addEventListener('click', () => {
            showLoader(true);
            updateStatus("Arayüzdeki alan taranıyor...");
            const bounds = map.getBounds();
            const bbox = `${bounds.getSouth()},${bounds.getWest()},${bounds.getNorth()},${bounds.getEast()}`;

            const query = `
                [out:json][timeout:25];
                (
                  node["amenity"="place_of_worship"]["religion"="muslim"](${bbox});
                  way["amenity"="place_of_worship"]["religion"="muslim"](${bbox});
                  relation["amenity"="place_of_worship"]["religion"="muslim"](${bbox});
                );
                out center;
            `;
            fetchOverpassData(query);
        });

        // Overpass API Veri Çekme Fonksiyonu
        function fetchOverpassData(query) {
            fetch('https://overpass-api.de/api/interpreter', {
                method: 'POST',
                body: 'data=' + encodeURIComponent(query)
            })
            .then(res => res.json())
            .then(data => {
                showLoader(false);
                renderResults(data.elements);
            })
            .catch(err => {
                showLoader(false);
                updateStatus("Veri çekilirken bir hata oluştu!");
                console.error(err);
            });
        }

        // Sonuçları Ekran ve Haritaya İşleme
        function renderResults(elements) {
            markersGroup.clearLayers();
            const listContainer = document.getElementById('results-list');
            listContainer.innerHTML = '';

            if (!elements || elements.length === 0) {
                updateStatus("Hiçbir sonuç bulunamadı.");
                document.getElementById('count-badge').innerText = '0';
                return;
            }

            updateStatus("Arama tamamlandı.");
            document.getElementById('count-badge').innerText = `${elements.length} Adet`;

            elements.forEach((item, index) => {
                // Koordinat tayini (Way veya Node durumuna göre)
                const lat = item.lat || (item.center && item.center.lat);
                const lon = item.lon || (item.center && item.center.lon);

                if (!lat || !lon) return;

                // **İSİMSİZ CAMİ DÜZELTMESİ**
                const tags = item.tags || {};
                const name = tags.name ? tags.name : (tags['name:tr'] || "İsimsiz Cami / Mescid");
                const isUnnamed = !tags.name;

                // Haritaya Marker Ekleme
                const marker = L.marker([lat, lon], { icon: mosqueIcon }).addTo(markersGroup);
                
                const popupContent = `
                    <div style="color:#0f172a; font-family:'Inter';">
                        <strong style="font-size:14px;">${name}</strong><br>
                        <span style="font-size:12px; color:#64748b;">${tags.building ? 'Bina Türü: ' + tags.building : 'İbadethane'}</span><br>
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}" target="_blank" style="display:inline-block; margin-top:6px; color:#0d9488; font-weight:600; text-decoration:none;">
                            <i class="fa-solid fa-diamond-turn-right"></i> Yol Tarifi Al
                        </a>
                    </div>
                `;
                marker.bindPopup(popupContent);

                // Liste Kartı Oluşturma
                const card = document.createElement('div');
                card.className = 'place-card';
                card.innerHTML = `
                    <h3>
                        ${name}
                        <span class="tag ${isUnnamed ? 'unnamed' : ''}">${isUnnamed ? 'İsimsiz' : 'Mescid/Cami'}</span>
                    </h3>
                    <p><i class="fa-solid fa-location-dot" style="color:#0d9488;"></i> Konuma Gitmek İçin Tıklayın</p>
                `;

                card.addEventListener('click', () => {
                    map.setView([lat, lon], 17);
                    marker.openPopup();
                });

                listContainer.appendChild(card);
            });
        }

        function showLoader(show) {
            document.getElementById('loader').style.display = show ? 'block' : 'none';
        }

        function updateStatus(text) {
            document.getElementById('status-text').innerText = text;
        }
    </script>
</body>
</html>
