<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Yakındaki Tüm Camiler</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    button { padding: 10px 15px; font-size: 16px; cursor: pointer; }
    #status { margin-top: 10px; font-weight: bold; }
    ul { margin-top: 15px; list-style-type: square; }
  </style>
</head>
<body>

  <h2>Yakındaki Tüm Camiler</h2>
  <button onclick="camileriBul()">Tüm Camileri Bul</button>
  
  <div id="status"></div>
  <ul id="cami-listesi"></ul>

  <script>
    async function camileriBul() {
      const status = document.getElementById('status');
      const liste = document.getElementById('cami-listesi');
      
      liste.innerHTML = '';
      status.innerText = 'Konumunuz alınıyor...';

      // 1. Tarayıcı Konum İzni Kontrolü
      if (!navigator.geolocation) {
        status.innerText = 'Tarayıcınız konum bilgisini desteklemiyor.';
        return;
      }

      navigator.geolocation.getCurrentPosition(async (position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        
        status.innerText = 'Yakındaki camiler aranıyor...';

        // 2. Overpass API Sorgusu (5 km yarıçapındaki camileri getirir)
        const radius = 5000; // Metre cinsinden mesafe
        const query = `
          [out:json];
          (
            node["amenity"="place_of_worship"]["religion"="muslim"](around:${radius},${lat},${lon});
            way["amenity"="place_of_worship"]["religion"="muslim"](around:${radius},${lat},${lon});
          );
          out center;
        `;

        try {
          const response = await fetch('https://overpass-api.de/api/interpreter', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: 'data=' + encodeURIComponent(query)
          });

          const data = await response.json();

          if (!data.elements || data.elements.length === 0) {
            status.innerText = 'Yakınınızda cami bulunamadı.';
            return;
          }

          status.innerText = `Toplam ${data.elements.length} cami bulundu:`;

          // 3. Bulunan Camileri Listeleme
          data.elements.forEach(item => {
            const name = item.tags && item.tags.name ? item.tags.name : 'İsimsiz Cami';
            const li = document.createElement('li');
            li.textContent = name;
            liste.appendChild(li);
          });

        } catch (error) {
          console.error('Hata:', error);
          status.innerText = 'Veri çekilirken bir hata oluştu.';
        }

      }, (error) => {
        // Konum izin hataları
        switch(error.code) {
          case error.PERMISSION_DENIED:
            status.innerText = "Konum izni reddedildi. Lütfen tarayıcı ayarlarından izin verin.";
            break;
          case error.POSITION_UNAVAILABLE:
            status.innerText = "Konum bilgisi alınamıyor.";
            break;
          case error.TIMEOUT:
            status.innerText = "Konum isteği zaman aşımına uğradı.";
            break;
          default:
            status.innerText = "Bilinmeyen bir konum hatası oluştu.";
            break;
        }
      });
    }
  </script>
</body>
</html>
