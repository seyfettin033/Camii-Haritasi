<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Türkiye Camii Rehberi & Veri Katkı Haritası</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<!-- Leaflet Marker Cluster CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

<style>
:root {
  --zumrut-koyu: #0A3225;
  --zumrut-orta: #124E3F;
  --zumrut-acik: #1E6B56;
  --gold-parlak: #D4AF37;
  --gold-soft: #AA771C;
  --gold-arka: #FDFBF7;
  --krem-bg: #F4F1EA;
  --metin-koyu: #1C2B26;
}

* { box-sizing: border-box; }
html, body { height:100%; margin:0; padding:0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--krem-bg);
  color: var(--metin-koyu);
  display: flex;
  flex-direction: column;
}

header {
  background: linear-gradient(135deg, var(--zumrut-koyu) 0%, var(--zumrut-orta) 100%);
  color: #ffffff;
  padding: 18px 12px;
  text-align: center;
  box-shadow: 0 4px 15px rgba(10, 50, 37, 0.4);
  border-bottom: 3px solid var(--gold-parlak);
}
header h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: #ffffff;
  text-shadow: 0 1px 3px rgba(0,0,0,0.3);
}
.bayrak-img {
  width: 28px;
  height: auto;
  border-radius: 3px;
  border: 1px solid var(--gold-parlak);
}
header small { 
  color: var(--gold-parlak); 
  font-size: 12.5px;
  margin-top: 5px;
  display: block;
}

.tabs {
  display: flex;
  background: var(--zumrut-orta);
  border-bottom: 2px solid var(--gold-parlak);
  overflow-x: auto;
}
.tab-btn {
  flex: 1;
  min-width: 110px;
  padding: 12px 10px;
  border: none;
  background: transparent;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  color: #C8DCCE;
  white-space: nowrap;
  transition: all 0.2s ease;
}
.tab-btn.active {
  background: var(--krem-bg);
  color: var(--zumrut-koyu);
  border-bottom: 4px solid var(--gold-parlak);
  font-weight: 700;
}

.filters {
  padding: 14px;
  background: var(--gold-arka);
  border-bottom: 1px solid #E2D9C8;
}
.filter-group { display: none; }
.filter-group.active { display: block; }

.form-label {
  display: block;
  font-weight: 700;
  font-size: 13px;
  color: var(--zumrut-koyu);
  margin-bottom: 6px;
}

select, input {
  width: 100%;
  padding: 11px;
  border-radius: 8px;
  border: 1.5px solid #CFC2A9;
  background: #ffffff;
  color: var(--metin-koyu);
  font-size: 14px;
  outline: none;
}

.search-box-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.search-box { display: flex; gap: 8px; }
.search-box input { flex: 1; }

.btn-action, .btn-location {
  padding: 12px;
  background: linear-gradient(135deg, var(--zumrut-orta) 0%, var(--zumrut-koyu) 100%);
  color: var(--gold-parlak);
  border: 1px solid var(--gold-parlak);
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  width: 100%;
}

#sayac {
  background: #EAE3D2;
  padding: 10px;
  text-align: center;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--zumrut-koyu);
  border-bottom: 1px solid #D8CCB5;
}

#map { flex: 1; width: 100%; min-height: 350px; }

.popup { font-size: 13px; text-align: center; padding: 4px; }
.popup b { color: var(--zumrut-koyu); display: block; margin-bottom: 3px; font-size: 14.5px; }
.popup small { color: #5C6B64; display: block; margin-bottom: 10px; }
.popup-links { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.popup a {
  display: block; text-align: center; padding: 7px 4px; border-radius: 6px;
  text-decoration: none; font-weight: 600; font-size: 11px; color: #fff;
}
.osm { background: var(--zumrut-koyu); border: 1px solid var(--gold-parlak); grid-column: span 2; }
.google { background: #D4AF37; color: #1C2B26 !important; }
.diyanet { background: #9E2A2B; }
.mapillary { background: #2A6F97; }
.panoramax { background: #6A4C93; }
.osm-note { background: #B23A48; grid-column: span 2; }
</style>
</head>

<body>

<header>
  <h1>
    <img src="https://flagcdn.com/w40/tr.png" alt="Türkiye Bayrağı" class="bayrak-img">
    Türkiye Camii Rehberi
  </h1>
  <small>OpenStreetMap Veri İyileştirme & Görselleştirme Platformu</small>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('konum')">📍 Yakınımdakiler</button>
  <button class="tab-btn" onclick="switchTab('isimsiz')">⚠️ İsimsiz Camiler</button>
  <button class="tab-btn" onclick="switchTab('tum')">🕌 Tüm Camiler</button>
  <button class="tab-btn" onclick="switchTab('arama')">🔍 Cami Ara</button>
</div>

<div class="filters">

  <div id="group-konum" class="filter-group active">
    <button class="btn-location" onclick="konumlaCamileriBul()">
      📍 Bulunduğum Konuma Göre Yakındaki Camileri Göster
    </button>
  </div>

  <div id="group-isimsiz" class="filter-group">
    <label class="form-label" for="il-isimsiz">📌 İsimsiz camileri listelemek için il seçiniz:</label>
    <select id="il-isimsiz" onchange="ilSecildi(this.value, 'isimsiz')">
      <option value="">-- İl Seçiniz --</option>
    </select>
  </div>

  <div id="group-tum" class="filter-group">
    <label class="form-label" for="il-tum">📌 Tüm camileri listelemek için il seçiniz:</label>
    <select id="il-tum" onchange="ilSecildi(this.value, 'tum')">
      <option value="">-- İl Seçiniz --</option>
    </select>
  </div>

  <div id="group-arama" class="filter-group">
    <form onsubmit="event.preventDefault(); camiAra();" class="search-box-group">
      <div>
        <label class="form-label" for="il-arama">📌 Arama Yapılacak Bölge:</label>
        <select id="il-arama">
          <option value="">Tüm Türkiye Geneli</option>
        </select>
      </div>

      <div class="search-box">
        <input type="text" id="cami-ismi" placeholder="Cami adı girin (Örn: Süleymaniye, Ulu)">
        <button type="submit" class="btn-action" style="width:auto;">Ara</button>
      </div>
    </form>
  </div>

</div>

<div id="sayac">Lütfen yukarıdaki menüden işlem seçiniz.</div>

<div id="map"></div>

<!-- Leaflet & MarkerCluster JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.js"></script>

<script>

const iller = [
  "Adana", "Adıyaman", "Afyonkarahisar", "Ağrı", "Amasya", "Ankara", "Antalya", "Artvin", "Aydın", "Balıkesir",
  "Bilecik", "Bingöl", "Bitlis", "Bolu", "Burdur", "Bursa", "Çanakkale", "Çankırı", "Çorum", "Denizli",
  "Diyarbakır", "Edirne", "Elazığ", "Erzincan", "Erzurum", "Eskişehir", "Gaziantep", "Giresun", "Gümüşhane", "Hakkari",
  "Hatay", "Isparta", "Mersin", "İstanbul", "İzmir", "Kars", "Kastamonu", "Kayseri", "Kırklareli", "Kırşehir",
  "Kocaeli", "Konya", "Kütahya", "Malatya", "Manisa", "Kahramanmaraş", "Mardin", "Muğla", "Muş", "Nevşehir",
  "Niğde", "Ordu", "Rize", "Sakarya", "Samsun", "Siirt", "Sinop", "Sivas", "Tekirdağ", "Tokat",
  "Trabzon", "Tunceli", "Şanlıurfa", "Uşak", "Van", "Yozgat", "Zonguldak", "Aksaray", "Bayburt", "Karaman",
  "Kırıkkale", "Batman", "Şırnak", "Bartın", "Ardahan", "Iğdır", "Yalova", "Karabük", "Kilis", "Osmaniye", "Düzce"
];

// Otomatik fallback için stabil Overpass sunucuları
const OVERPASS_ENDPOINTS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
  "https://maps.mail.ru/osm/tools/overpass/api/interpreter"
];

document.addEventListener("DOMContentLoaded", function() {
  const ilSelectIsimsiz = document.getElementById("il-isimsiz");
  const ilSelectTum = document.getElementById("il-tum");
  const ilSelectArama = document.getElementById("il-arama");

  iller.forEach((il, index) => {
    const plakaNo = (index + 1).toString().padStart(2, '0');
    ilSelectIsimsiz.add(new Option(`${plakaNo} - ${il}`, il));
    ilSelectTum.add(new Option(`${plakaNo} - ${il}`, il));
    ilSelectArama.add(new Option(`${plakaNo} - ${il}`, il));
  });
});

const map = L.map('map').setView([39, 35], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© OpenStreetMap'
}).addTo(map);

const clusterGroup = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 40 }).addTo(map);

function escapeHtml(text) {
  if (!text) return "";
  return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function switchTab(mode) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('.filter-group').forEach(grp => grp.classList.remove('active'));
  clusterGroup.clearLayers();

  if (mode === 'konum') {
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    document.getElementById('group-konum').classList.add('active');
    document.getElementById('sayac').innerHTML = "Yakındaki camileri bulmak için butona basın.";
  } else if (mode === 'isimsiz') {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('group-isimsiz').classList.add('active');
    document.getElementById('sayac').innerHTML = "Lütfen listeden bir il seçiniz.";
  } else if (mode === 'tum') {
    document.querySelectorAll('.tab-btn')[2].classList.add('active');
    document.getElementById('group-tum').classList.add('active');
    document.getElementById('sayac').innerHTML = "Lütfen listeden bir il seçiniz.";
  } else {
    document.querySelectorAll('.tab-btn')[3].classList.add('active');
    document.getElementById('group-arama').classList.add('active');
    document.getElementById('sayac').innerHTML = "Cami adı girip 'Ara' butonuna basın.";
  }
}

async function ilSecildi(ilAdi, mod) {
  if (!ilAdi) return;

  const sayac = document.getElementById("sayac");
  sayac.innerHTML = `🔍 ${ilAdi} verileri sorgulanıyor...`;

  let query = "";
  if (mod === 'isimsiz') {
    query = `[out:json][timeout:30];
    area["ISO3166-2"="TR-${getPlakaNo(ilAdi)}"]->.searchArea;
    (
      node["amenity"="place_of_worship"]["religion"="muslim"]["name"!~"."](area.searchArea);
      way["amenity"="place_of_worship"]["religion"="muslim"]["name"!~"."](area.searchArea);
    );
    out center qt;`;
    overpassSorgula(query, `${ilAdi} ilindeki isimsiz camiler`, "#B23A48");
  } else if (mod === 'tum') {
    query = `[out:json][timeout:30];
    area["ISO3166-2"="TR-${getPlakaNo(ilAdi)}"]->.searchArea;
    (
      node["amenity"="place_of_worship"]["religion"="muslim"](area.searchArea);
      way["amenity"="place_of_worship"]["religion"="muslim"](area.searchArea);
    );
    out center qt;`;
    overpassSorgula(query, `${ilAdi} ilindeki tüm camiler`, "#124E3F");
  }
}

function getPlakaNo(ilAdi) {
  const index = iller.indexOf(ilAdi);
  return (index + 1).toString().padStart(2, '0');
}

function konumlaCamileriBul() {
  const sayac = document.getElementById("sayac");
  if (!navigator.geolocation) {
    alert("Tarayıcınız konum özelliğini desteklemiyor.");
    return;
  }

  sayac.innerHTML = "📡 Konumunuz tespit ediliyor...";

  navigator.geolocation.getCurrentPosition(
    (position) => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      clusterGroup.clearLayers();
      const userMarker = L.marker([lat, lon]).bindPopup("<b>📍 Buradasınız</b>");
      clusterGroup.addLayer(userMarker);
      userMarker.openPopup();

      map.setView([lat, lon], 14);

      const query = `[out:json][timeout:25];
      (
        node["amenity"="place_of_worship"]["religion"="muslim"](around:5000, ${lat}, ${lon});
        way["amenity"="place_of_worship"]["religion"="muslim"](around:5000, ${lat}, ${lon});
      );
      out center qt;`;

      overpassSorgula(query, "Yakınınızdaki camiler (5 km)", "#124E3F", false);
    },
    () => { sayac.innerHTML = "❌ Konum alınamadı. İzin verildiğinden emin olun."; },
    { timeout: 10000, enableHighAccuracy: true }
  );
}

async function camiAra() {
  const isim = document.getElementById("cami-ismi").value.trim();
  const ilAdi = document.getElementById("il-arama").value;
  const sayac = document.getElementById("sayac");

  if (!isim) return alert("Lütfen aranacak cami adını girin.");

  const guvenliIsim = isim.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  let query = "";

  if (ilAdi) {
    query = `[out:json][timeout:30];
    area["ISO3166-2"="TR-${getPlakaNo(ilAdi)}"]->.searchArea;
    (
      node["amenity"="place_of_worship"]["religion"="muslim"]["name"~"${guvenliIsim}",i](area.searchArea);
      way["amenity"="place_of_worship"]["religion"="muslim"]["name"~"${guvenliIsim}",i](area.searchArea);
    );
    out center qt;`;
    overpassSorgula(query, `${ilAdi} - "${isim}" araması`, "#124E3F");
  } else {
    query = `[out:json][timeout:40];
    area["ISO3166-1"="TR"]->.trArea;
    (
      node["amenity"="place_of_worship"]["religion"="muslim"]["name"~"${guvenliIsim}",i](area.trArea);
      way["amenity"="place_of_worship"]["religion"="muslim"]["name"~"${guvenliIsim}",i](area.trArea);
    );
    out center qt;`;
    overpassSorgula(query, `Türkiye geneli - "${isim}" araması`, "#124E3F");
  }
}

async function overpassSorgula(query, baslikMetni, varsayilanNoktaRengi, temizle = true) {
  if (temizle) clusterGroup.clearLayers();

  const sayac = document.getElementById("sayac");
  sayac.innerHTML = `⏳ ${baslikMetni} yükleniyor...`;

  let success = false;
  let data = null;

  for (let i = 0; i < OVERPASS_ENDPOINTS.length; i++) {
    const endpoint = OVERPASS_ENDPOINTS[i];
    try {
      const response = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "data=" + encodeURIComponent(query)
      });

      if (response.ok) {
        data = await response.json();
        success = true;
        break;
      }
    } catch (e) {
      console.warn(`${endpoint} isteğe yanıt vermedi, deneniyor...`);
    }
  }

  if (!success || !data) {
    sayac.innerHTML = `❌ Veriler sunucudan çekilemedi. Lütfen daha dar bir il veya ilçe araması deneyin.`;
    return;
  }

  const elements = data.elements || [];
  if (elements.length === 0) {
    sayac.innerHTML = `❌ ${baslikMetni} için kayıt bulunamadı.`;
    return;
  }

  const bounds = [];
  const markers = [];
  const seenIds = new Set();

  elements.forEach(el => {
    const uniqueKey = `${el.type}/${el.id}`;
    if (seenIds.has(uniqueKey)) return;
    seenIds.add(uniqueKey);

    const lat = el.lat || (el.center && el.center.lat);
    const lon = el.lon || (el.center && el.center.lon);

    if (!lat || !lon) return;

    const hasName = el.tags && el.tags.name;
    const guvenliCamiAdi = escapeHtml(hasName ? el.tags.name : "❗ İsimsiz Cami");
    const noktaRengi = hasName ? varsayilanNoktaRengi : "#B23A48";

    bounds.push([lat, lon]);

    const popup = `
    <div class="popup">
      <b>${guvenliCamiAdi}</b>
      <small>ID: ${el.type}/${el.id}</small>
      <div class="popup-links">
        <a class="google" target="_blank" href="https://www.google.com/maps?q=${lat},${lon}">🔍 Google</a>
        <a class="diyanet" target="_blank" href="https://camiler.diyanet.gov.tr">🕌 Diyanet</a>
        <a class="mapillary" target="_blank" href="https://www.mapillary.com/app/?lat=${lat}&lng=${lon}&z=18">📸 Mapillary</a>
        <a class="panoramax" target="_blank" href="https://panoramax.openstreetmap.fr/#focus=map&map=18/${lat}/${lon}">📷 Panoramax</a>
        <a class="osm" target="_blank" href="https://www.openstreetmap.org/edit?${el.type}=${el.id}">✍️ OSM'de Düzenle</a>
        <a class="osm-note" target="_blank" href="https://www.openstreetmap.org/note/new#map=19/${lat}/${lon}">🚨 Not Ekle</a>
      </div>
    </div>`;

    const m = L.circleMarker([lat, lon], {
      radius: 6,
      color: "#D4AF37",
      weight: 1.5,
      fillColor: noktaRengi,
      fillOpacity: 0.95
    }).bindPopup(popup);

    markers.push(m);
  });

  clusterGroup.addLayers(markers);

  if (bounds.length > 0 && temizle) {
    map.fitBounds(bounds, { padding: [30, 30] });
  }

  sayac.innerHTML = `📍 ${baslikMetni} – <b>${markers.length}</b> adet veri haritaya yüklendi.`;
}

</script>

</body>
</html>
